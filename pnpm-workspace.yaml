packages:
  - apps/*
  - packages/*

allowBuilds:
  # Its postinstall downloads PowerSync extensions; TanStack DB's worker bundles its own build.
  '@journeyapps/wa-sqlite': false
  esbuild: true
  # Prebuilt libvips ships in @img/sharp-*; its install script only checks for it.
  sharp: false
  # Wrangler installs it during site deployment; postinstall prepares its native runtime.
  workerd: true

patchedDependencies:
  '@tanstack/db-sqlite-persistence-core@0.2.23': patches/@tanstack__db-sqlite-persistence-core@0.2.23.patch

# Catch uses the Drizzle adapter and React client, not these optional integrations.
# Keeping them out also prevents development tools from entering production deploys.
overrides:
  'better-auth>drizzle-kit': '-'
  'better-auth>next': '-'
  'better-auth>vitest': '-'
  # BlockNote's Shiki types and the app's highlighter must share one copy, or their
  # highlighter types disagree and `codeBlock.ts` stops typechecking.
  '@shikijs/vscode-textmate': '^10.1.0'
