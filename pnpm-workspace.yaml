packages:
  - apps/*
  - packages/*

allowBuilds:
  # Its postinstall downloads PowerSync extensions; TanStack DB's worker bundles its own build.
  '@journeyapps/wa-sqlite': false
  esbuild: true
  # Prebuilt libvips ships in @img/sharp-*; its install script only checks for it.
  sharp: false
  # Wrangler installs it during site deployment; postinstall prepares its native runtime.
  workerd: true

minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.40'
  - '@tanstack/router-core@1.171.33'
  - '@tanstack/router-generator@1.167.39'
  - '@tanstack/router-plugin@1.168.41'

patchedDependencies:
  '@tanstack/db-sqlite-persistence-core@0.2.23': patches/@tanstack__db-sqlite-persistence-core@0.2.23.patch
