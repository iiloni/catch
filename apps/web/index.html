<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#23211e" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48" />
    <link rel="icon" href="/favicon-mark.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Catch</title>
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      try {
        const theme = JSON.parse(localStorage.getItem('catch-theme') ?? 'null');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
