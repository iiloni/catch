# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
version: 1

reviews:
  enabled: true
  sensitivity: medium
  check_drafts: true
  incremental_commits: false
  auto_approve_behavior: disabled
  auto_approve: disabled
  ultrareview: manual
  auto_ultrareview: disabled
  # Suppress automatic reviews on every base branch; explicit requests still work.
  ignore:
    base_branches:
      - '*'
    files:
      - pnpm-lock.yaml
      - apps/web/src/routeTree.gen.ts
      - apps/server/drizzle/meta/**
      - apps/web/android/app/build/**
      - apps/web/android/app/src/main/assets/public/**
  custom_instructions: |
    Read AGENTS.md and the relevant docs/decisions/ records before reviewing changes.
    Prioritize concrete correctness, security, data-loss and regression findings.
    Explain the trigger and impact of each finding using evidence from the code.
    Avoid formatting nits already covered by Biome, speculative refactors, and
    requests for tests that merely repeat the implementation. Keep meaningful
    test gaps, migration SQL, native Android code and CI workflows in scope.

    Catch is offline-first. Optimistic writes must go through write() and survive
    network/auth/protocol interruptions. Replay must be safe, with the correct
    txid acknowledgement. Never discard persisted notes or an outbox to recover.
    Shape column changes require a collection schemaVersion bump; this does not
    migrate queued writes or persisted note encoding. IDs are client-generated.

    Filter user-data queries and Electric shapes by the authenticated userId.
    Preserve explicit shape column allowlists and admin authorization. Fetch link
    previews through safeFetch to prevent requests to private addresses.
    Check old-client/new-server and new-client/old-server behavior under ADR 0013.
    Shared TypeScript types do not prove mixed-version compatibility. Compatible
    changes do not require an API protocol bump; incompatible ones need a tested
    support range and lossless adapters for affected device data and queued writes.

    Account for Android bearer authentication, offline PWA behavior, touch controls,
    keyboard/safe-area insets, and page width when an editor opens in a split pane.
    Follow the existing design tokens and named haptic events. Review E2E waits
    against actual editor focus and settled transitions rather than fixed sleeps.

    Reviews are advisory. Only the maintainer's merge on pass approval authorizes
    merging; do not infer approval from an ai review label or a clean AI review.

pr_descriptions:
  generate: false

issues:
  fix_with_cubic_buttons: false
  pr_comment_fixes: false
