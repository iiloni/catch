# Self-hosted deployment. Copy .env.example to .env and set BETTER_AUTH_SECRET,
# BETTER_AUTH_URL (your public URL), POSTGRES_PASSWORD and ELECTRIC_SECRET first.
# Development uses this file plus docker-compose.dev.yml through scripts/dev.sh.
name: catch

services:
  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - '${CATCH_BIND_ADDRESS:-0.0.0.0}:${CATCH_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgres://catch:${POSTGRES_PASSWORD:-catch}@postgres:5432/catch
      ELECTRIC_URL: http://electric:3000
      ELECTRIC_SECRET: ${ELECTRIC_SECRET:-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-true}
      REGISTRATION: ${REGISTRATION:-closed}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ATTACHMENT_QUOTA_MB: ${ATTACHMENT_QUOTA_MB:-10240}
      LINK_PREVIEWS: ${LINK_PREVIEWS:-true}
      ATTACHMENTS_DIR: /data/attachments
      BACKUPS_DIR: /data/backups
      UPDATE_BACKUPS: ${UPDATE_BACKUPS:-true}
      UPDATE_BACKUPS_KEPT: ${UPDATE_BACKUPS_KEPT:-10}
    volumes:
      - ${CATCH_ATTACHMENTS_MOUNT:-attachment_data}:/data/attachments
      # Server backups (docs/backups.md). A directory on another disk outlives this one.
      - ${CATCH_BACKUPS_MOUNT:-backup_data}:/data/backups
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      electric:
        condition: service_started

  postgres:
    # The app image's pg_dump must be at least this major version (POSTGRES_MAJOR in the
    # Dockerfile), or backups fail.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: catch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catch}
      POSTGRES_DB: catch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catch -d catch']
      interval: 2s
      timeout: 5s
      retries: 30

  # Streams Postgres changes to clients. Only reachable through the app's auth proxy.
  electric:
    image: electricsql/electric:1.8.1
    # Build the same upstream release if its prebuilt image is unavailable.
    build:
      context: https://github.com/electric-sql/electric.git#0f404200402f918a4b1596bc5c8a53479a435349:packages/sync-service
      additional_contexts:
        electric-telemetry: https://github.com/electric-sql/electric.git#0f404200402f918a4b1596bc5c8a53479a435349:packages/electric-telemetry
      args:
        ELECTRIC_VERSION: 1.8.1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://catch:${POSTGRES_PASSWORD:-catch}@postgres:5432/catch?sslmode=disable
      ELECTRIC_SECRET: ${ELECTRIC_SECRET:-change-me}
    volumes:
      - electric_data:/app/persistent
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  attachment_data:
  backup_data:
  postgres_data:
  electric_data:
