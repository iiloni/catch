# Development override, one isolated stack per Git worktree. Use it through
# ./scripts/dev.sh, which supplies the worktree's generated .env.worktree.
services:
  app:
    # Built here, so it must not take the published image's name.
    image: !reset null
    build:
      context: .
      target: development
    restart: 'no'
    user: '${CATCH_UID:-1000}:${CATCH_GID:-1000}'
    env_file:
      - path: ${CATCH_PRIMARY_ENV:-.env}
        required: false
    environment:
      NODE_ENV: development
      # The container runs as the host UID, which may have no home directory in the image.
      HOME: /tmp
      BETTER_AUTH_URL: http://${CATCH_PUBLIC_HOST:-localhost}:${CATCH_PORT:-5173}
      TRUSTED_ORIGINS: http://${CATCH_PUBLIC_HOST:-localhost}:${CATCH_PORT:-5173},http://localhost:${CATCH_PORT:-5173},http://127.0.0.1:${CATCH_PORT:-5173}
      CATCH_SEED_PROFILE: ${CATCH_SEED_PROFILE:-demo}
      # Seeding and the E2E tests make accounts of their own.
      REGISTRATION: open
      CATCH_DEV_HOST: 0.0.0.0
      CATCH_DEV_ALLOWED_HOSTS: ${CATCH_PUBLIC_HOST:-localhost},.ts.net
      PNPM_CONFIG_STORE_DIR: /pnpm-store
      # `dev.sh up` installs in a disposable container; retain lockfile verification.
      PNPM_CONFIG_CACHE_DIR: /pnpm-cache
    ports: !override
      - '${CATCH_DEV_BIND_ADDRESS:-127.0.0.1}:${CATCH_PORT:-5173}:5173'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      retries: 150
      start_period: 120s
    volumes:
      - .:/workspace
      # Container dependencies stay out of the bind-mounted checkout, so they
      # never clash with a host `pnpm install`. Add a volume per new package.
      - node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - server_node_modules:/workspace/apps/server/node_modules
      - shared_node_modules:/workspace/packages/shared/node_modules
      - site_node_modules:/workspace/apps/site/node_modules
      - pnpm_store:/pnpm-store
      - pnpm_cache:/pnpm-cache

volumes:
  node_modules:
  web_node_modules:
  server_node_modules:
  shared_node_modules:
  site_node_modules:
  pnpm_cache:
  # Shared by every worktree as a download cache; created by scripts/dev.sh.
  pnpm_store:
    name: catch-pnpm-store
    external: true
