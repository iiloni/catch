name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  queue: max
  cancel-in-progress: false

jobs:
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run_checks: ${{ steps.ci.outputs.run_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter catch
      - name: Check for a previous successful CI run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-ci.ts check

  check:
    needs: reuse
    if: needs.reuse.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 branding/preview/derive-preview-icons.py --check
      - run: python3 branding/dev/derive-dev-icons.py --check
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm check

  e2e:
    needs: reuse
    if: needs.reuse.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A hosted runner has two cores for the whole stack and the browsers. Two workers on
    # one runner starve each other into timeouts, so each project gets its own runner.
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Exercises the same worktree stack developers and agents use.
      - run: ./scripts/dev.sh up
      # Server backups are tested against a real Postgres with its client tools, which the
      # check job's bare runner lacks (the tests skip themselves there) and this stack has.
      - if: matrix.project == 'desktop'
        run: ./scripts/dev.sh test
      - run: ./scripts/dev.sh e2e --project=${{ matrix.project }} --workers=1
      - if: failure()
        run: ./scripts/dev.sh logs-once
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-${{ matrix.project }}
          path: test-results
          retention-days: 7
