name: Site

# Builds the public site (apps/site, ADR 0020) and uploads it to Cloudflare Workers. Pull
# requests only build it, in CI's check job.
on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - branding/**
      - apps/web/public/wordmark/**
      - apps/web/public/favicon-mark.svg
      - scripts/changelog.ts
      - scripts/release.ts
      - pnpm-lock.yaml
      - .github/workflows/site.yml
    # A release adds a version to the changelog page.
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Enabled after the repository has its Cloudflare credentials (docs/ci.md).
    if: vars.CLOUDFLARE_SITE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Always main, with every tag: a tag can point at an older commit than the site's
      # source, and the changelog is derived from the whole history (ADR 0017).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The root package holds what the changelog generator imports.
      - run: pnpm install --frozen-lockfile --filter catch --filter '@catch/site...'
      - run: pnpm --filter @catch/site build
        env:
          SITE_CHANGELOG: required
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.148.0'
          packageManager: pnpm
          workingDirectory: apps/site
          command: deploy
