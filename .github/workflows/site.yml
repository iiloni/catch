name: Site

# Builds the public site (apps/site, ADR 0020) and uploads it to Cloudflare Workers. Pull
# requests only build it, in CI's check job.
on:
  # The site describes the latest stable release (ADR 0020), so a push to main does not
  # deploy it. Every release tag does, because the changelog lists previews too.
  push:
    # These events cover tags and releases created outside Actions. GITHUB_TOKEN
    # suppresses both, so Release explicitly dispatches Site after publication.
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Enabled after the repository has its Cloudflare credentials (docs/ci.md).
    if: vars.CLOUDFLARE_SITE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Every tag and the whole history: the changelog is derived from them (ADR 0017), and
      # the next step picks the release to build from them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # The site's pages and docs come from the latest stable release, whatever triggered
      # this run; a preview tag only brings the changelog up to date.
      - name: Check out the latest stable release
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sed -n 1p || true)
          if [ -z "$tag" ]; then
            echo '::error::There is no stable release tag to build the site from.'
            exit 1
          fi
          git checkout --quiet --detach "refs/tags/$tag"
          echo "Building the site from $tag." >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The root package holds what the changelog generator imports.
      - run: pnpm install --frozen-lockfile --filter catch --filter '@catch/site...'
      - run: pnpm --filter @catch/site build
        env:
          SITE_CHANGELOG: required
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.148.0'
          packageManager: pnpm
          workingDirectory: apps/site
          command: deploy
