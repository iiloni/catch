name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Preserve queued releases and serialize channel promotion and Android version codes.
concurrency:
  group: catch-release
  queue: max
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      flavor: ${{ steps.version.outputs.flavor }}
      gradle_task: ${{ steps.version.outputs.gradle_task }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Require a release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != tag ]]; then
            echo '::error::Run Release on an existing release tag, not a branch.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter catch
      - name: Validate release version
        id: version
        run: node scripts/release.ts metadata
      - name: Check release switch
        id: gate
        env:
          ENABLED: ${{ vars.RELEASES_ENABLED == 'true' }}
        run: |
          printf 'enabled=%s\n' "$ENABLED" >> "$GITHUB_OUTPUT"
          if [[ "$ENABLED" != true ]]; then
            echo 'Release builds are disabled. Configure signing secrets, then set RELEASES_ENABLED=true.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Reject already published tags
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq '[.[][] | {tagName: .tag_name, isDraft: .draft}]' > "$RUNNER_TEMP/releases.json"
          node scripts/release.ts promotion "$RELEASE_TAG" "$RUNNER_TEMP/releases.json"
      - name: Validate Android signing secrets
        if: steps.gate.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done

  checks:
    needs: version
    if: needs.version.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter catch
      - name: Wait for successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-ci.ts

  android:
    needs: [version, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CATCH_VERSION: ${{ needs.version.outputs.version }}
      CATCH_CHANNEL: ${{ needs.version.outputs.channel }}
      CATCH_VERSION_CODE: ${{ needs.version.outputs.version_code }}
      RELEASE_FLAVOR: ${{ needs.version.outputs.flavor }}
      RELEASE_TASK: ${{ needs.version.outputs.gradle_task }}
      # Named here, not in a job output: GitHub drops an output that contains a secret's
      # value, and the documented key alias is "catch".
      RELEASE_APK: catch-${{ needs.version.outputs.version }}.apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/catch-release.keystore"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/catch-release.keystore" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: pnpm install --frozen-lockfile
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - run: pnpm --filter @catch/web android:sync
      - name: Build signed APK
        working-directory: apps/web/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew "$RELEASE_TASK" --no-daemon --no-configuration-cache
      - name: Verify and checksum APK
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp "apps/web/android/app/build/outputs/apk/$RELEASE_FLAVOR/release/app-$RELEASE_FLAVOR-release.apk" "$RUNNER_TEMP/apk/$RELEASE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RUNNER_TEMP/apk/$RELEASE_APK"
          cd "$RUNNER_TEMP/apk"
          sha256sum "$RELEASE_APK" > "$RELEASE_APK.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk-${{ github.ref_name }}
          path: ${{ runner.temp }}/apk/
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/catch-release.keystore"

  image:
    needs: [version, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # A job output holding the image name would be dropped for containing "catch".
      - name: Name image
        run: |
          printf 'IMAGE=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and publish exact image version
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          build-args: |
            CATCH_CHANNEL=${{ needs.version.outputs.channel }}
            CATCH_VERSION=${{ needs.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,scope=release-image,mode=max

  publish:
    needs: [version, android, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-apk-${{ github.ref_name }}
          path: release-assets
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile --filter catch
      - name: Name image
        run: |
          printf 'IMAGE=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Determine whether to advance channel
        id: promotion
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq '[.[][] | {tagName: .tag_name, isDraft: .draft}]' > "$RUNNER_TEMP/releases.json"
          node scripts/release.ts promotion "$RELEASE_TAG" "$RUNNER_TEMP/releases.json"
      - name: Prepare release notes
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Channel: $CHANNEL

          Docker image: \`$IMAGE:$VERSION\`

          Pinned Docker image: \`$IMAGE@$DIGEST\`

          Source commit: \`$GITHUB_SHA\`

          Android version code: $VERSION_CODE

          Download the signed APK and its SHA-256 checksum below. Stable and preview Android apps can be installed together.
          EOF
      - name: Create or resume draft release
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Catch $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE"
          else
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.promotion.outputs.promote == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.promotion.outputs.promote == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Advance channel image aliases
        if: steps.promotion.outputs.promote == 'true'
        run: |
          tags=(--tag "$IMAGE:$CHANNEL")
          if [[ "$CHANNEL" == stable ]]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
      - name: Publish completed release
        env:
          PROMOTE: ${{ steps.promotion.outputs.promote }}
        run: |
          latest=false
          if [[ "$CHANNEL" == stable && "$PROMOTE" == true ]]; then
            latest=true
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" --latest="$latest"
          printf 'Published [%s](%s/%s/releases/tag/%s) (%s).\n' "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$CHANNEL" >> "$GITHUB_STEP_SUMMARY"
