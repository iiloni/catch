name: Tag release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        required: true
        default: preview
        options: [preview, stable]
      version_type:
        description: Version bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read

# Fetch tags inside the queued job so each bump sees earlier manual releases.
concurrency:
  group: catch-tag-release
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Require releases to be enabled
        env:
          ENABLED: ${{ vars.RELEASES_ENABLED == 'true' }}
        run: |
          if [[ "$ENABLED" != true ]]; then
            echo '::error::Configure signing secrets and set RELEASES_ENABLED=true before creating a release.'
            exit 1
          fi
      - name: Resolve trusted release helper
        id: trusted
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const { data: commit } = await github.rest.repos.getCommit({
              ...context.repo,
              ref: process.env.DEFAULT_BRANCH,
            });
            core.setOutput('sha', commit.sha);
      # Only the default branch's helper, dependencies and tool configuration execute.
      - name: Checkout trusted release helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter catch
      - name: Fetch release target history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-target
          fetch-depth: 0
          persist-credentials: false
      - name: Create annotated release tag
        id: release
        working-directory: release-target
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          "$GITHUB_WORKSPACE/scripts/release.sh" "$CHANNEL" "$VERSION_TYPE"

  tag:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      # This runner never checks out code or installs dependencies from either ref.
      - name: Publish annotated release tag
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG ?? '';
            if (tag.length > 128 || tag.trim() !== tag ||
                !/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-preview)?$/.test(tag)) {
              throw new Error('Invalid release tag from preparation.');
            }
            const { data: object } = await github.rest.git.createTag({
              ...context.repo,
              tag,
              message: `Catch ${tag.slice(1)}`,
              object: context.sha,
              type: 'commit',
              tagger: {
                name: 'github-actions[bot]',
                email: '41898282+github-actions[bot]@users.noreply.github.com',
              },
            });
            await github.rest.git.createRef({
              ...context.repo,
              ref: `refs/tags/${tag}`,
              sha: object.sha,
            });
            await core.summary
              .addRaw(`Created ${tag} at ${context.sha}.\n`)
              .addRaw('If dispatch fails, run Release on this tag; rerunning Tag release creates another version.\n')
              .write();
      # GITHUB_TOKEN ref creation does not trigger the tag-push workflow.
      - name: Start release builds on the new tag
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'release.yml',
              ref: process.env.RELEASE_TAG,
            });
