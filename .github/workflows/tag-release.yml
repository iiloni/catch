name: Tag release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        required: true
        default: preview
        options: [preview, stable]
      version_type:
        description: Version bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read

# Fetch tags inside the queued job so each bump sees earlier manual releases.
concurrency:
  group: catch-tag-release
  queue: max
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require releases to be enabled
        env:
          ENABLED: ${{ vars.RELEASES_ENABLED == 'true' }}
        run: |
          if [[ "$ENABLED" != true ]]; then
            echo '::error::Configure signing secrets and set RELEASES_ENABLED=true before creating a release.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter catch
      - name: Create annotated release tag
        id: release
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./scripts/release.sh "$CHANNEL" "$VERSION_TYPE"
      - name: Push release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh auth setup-git
          git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          printf 'Created [%s](%s/%s/releases/tag/%s) at `%s`.\n' "$RELEASE_TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'If dispatch fails, run the Release workflow on this tag; rerunning Tag release creates another version.' >> "$GITHUB_STEP_SUMMARY"
      # GITHUB_TOKEN pushes do not trigger the tag-push workflow.
      - name: Start release builds on the new tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run release.yml --ref "$RELEASE_TAG"
